# Environments and test users for the task management QA framework.
# Users are declared per environment, since each environment's pre-provisioned admin identity is
# specific to it. Passwords are secrets and are never stored here - see .env.example
# (<USERNAME_UPPER>_PASSWORD env vars). Select the active environment/user via
# `pytest --environment=... --user=...`, or the ENVIRONMENT/TEST_USER env vars; both fall back to the
# [default] section below.
#
# Extra identities needed only within a test scenario (e.g. a second/third user for cross-user or
# ownership checks) are NOT declared here - create them on demand with the `make_user`/
# `make_user_auth` factory fixtures (tests/conftest.py), which register a fresh, randomly-named user
# via POST /users for the duration of that test.

[default]
environment = test
user = QA

[environment.test]
base_url = https://luk-ole.rnd1.candidates.ondku.net

# The one pre-provisioned identity for the "test" environment - used to seed data and as the default
# auth in most tests. The API grants it no special privileges; this label is a test-framework
# convenience only.
[environment.test.user.QA]
