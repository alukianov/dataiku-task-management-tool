name: UI Test Suite

on:
    workflow_call:
        inputs:
            environment:
                description: "Environment name from config.ini (blank = config.ini default)"
                required: false
                type: string
            workers:
                description: "pytest-xdist worker count"
                required: false
                type: string
                default: "2"
            marker:
                description: "Optional pytest marker expression, e.g. smoke or auth and negative"
                required: false
                type: string
            allure_features:
                description: "Optional comma-separated Allure feature names"
                required: false
                type: string

permissions:
    contents: write

jobs:
    ui-tests:
        runs-on: ubuntu-24.04
        env:
            ENVIRONMENT_ARG: ${{ inputs.environment }}
            WORKERS: ${{ inputs.workers }}
            MARKER_FILTER: ${{ inputs.marker }}
            ALLURE_FEATURES: ${{ inputs.allure_features }}
            QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
            HEADLESS: "true"
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Set up Chrome
              uses: browser-actions/setup-chrome@v2

            - name: Run UI tests (Chrome, Full HD)
              run: |
                  if [ -n "$MARKER_FILTER" ]; then
                      PYTEST_MARKER="ui and ($MARKER_FILTER)"
                  else
                      PYTEST_MARKER="ui"
                  fi
                  ARGS=(-n "$WORKERS" -m "$PYTEST_MARKER" --browser=chrome --resolution=fullhd)
                  [ -n "$ENVIRONMENT_ARG" ] && ARGS+=(--environment "$ENVIRONMENT_ARG")
                  [ -n "$ALLURE_FEATURES" ] && ARGS+=(--allure-features "$ALLURE_FEATURES")
                  pytest "${ARGS[@]}"

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: allure-results-ui
                  path: reports/allure-results
