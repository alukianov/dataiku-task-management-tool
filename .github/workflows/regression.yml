name: Regression

on:
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:
        inputs:
            suite:
                description: "Which suites to run"
                required: false
                type: choice
                options:
                    - all
                    - api
                    - ui
                default: all
            environment:
                description: "Environment name from config.ini (blank = config.ini default)"
                required: false
                type: string
            workers:
                description: "pytest-xdist worker count"
                required: false
                type: string
                default: "2"
            marker:
                description: "Optional pytest marker expression, e.g. security or auth and negative"
                required: false
                type: string
            allure_features:
                description: "Optional comma-separated Allure feature names"
                required: false
                type: string
            publish_report:
                description: "Publish the Allure report to gh-pages"
                required: false
                type: boolean
                default: true

permissions:
    contents: write

concurrency:
    group: regression
    cancel-in-progress: false

jobs:
    reset:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Reset instance
              env:
                  ENVIRONMENT_ARG: ${{ inputs.environment }}
              run: python -m scripts.reset_instance --environment "$ENVIRONMENT_ARG"

    api-tests:
        needs: reset
        if: inputs.suite != 'ui'
        uses: ./.github/workflows/test-api.yml
        with:
            environment: ${{ inputs.environment }}
            workers: ${{ inputs.workers || '2' }}
            marker: ${{ inputs.marker }}
            allure_features: ${{ inputs.allure_features }}
        secrets: inherit

    ui-tests:
        needs: reset
        if: inputs.suite != 'api'
        uses: ./.github/workflows/test-ui.yml
        with:
            environment: ${{ inputs.environment }}
            workers: ${{ inputs.workers || '2' }}
            marker: ${{ inputs.marker }}
            allure_features: ${{ inputs.allure_features }}
        secrets: inherit

    publish-report:
        needs: [api-tests, ui-tests]
        # Scheduled runs have no inputs, so publish_report is null there and must default to publishing.
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish_report) }}
        uses: ./.github/workflows/publish-allure-report.yml
        with:
            # Single-suite runs get their own folder so they don't skew the full regression history.
            report_dir: ${{ (inputs.suite == 'api' && 'regression-api') || (inputs.suite == 'ui' && 'regression-ui') || 'regression' }}
        secrets: inherit
