name: Regression

on:
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment name from config.ini (blank = config.ini default)"
                required: false
                type: string
            workers:
                description: "pytest-xdist worker count"
                required: false
                type: string
                default: "2"
            marker:
                description: "Optional pytest marker expression, e.g. security or auth and negative"
                required: false
                type: string
            allure_features:
                description: "Optional comma-separated Allure feature names"
                required: false
                type: string

permissions:
    contents: write

concurrency:
    group: regression
    cancel-in-progress: false

jobs:
    api-tests:
        uses: ./.github/workflows/test-api.yml
        with:
            environment: ${{ inputs.environment }}
            workers: ${{ inputs.workers || '2' }}
            marker: ${{ inputs.marker }}
            allure_features: ${{ inputs.allure_features }}
            publish_report: false
        secrets: inherit

    # Runs after api-tests so the RESET_BEFORE_RUN wipe (test-api.yml) happens exactly once, before
    # either suite touches the shared instance.
    ui-tests:
        needs: api-tests
        uses: ./.github/workflows/test-ui.yml
        with:
            environment: ${{ inputs.environment }}
            workers: ${{ inputs.workers || '2' }}
            marker: ${{ inputs.marker }}
            allure_features: ${{ inputs.allure_features }}
            publish_report: false
        secrets: inherit

    publish-report:
        needs: [api-tests, ui-tests]
        if: always()
        uses: ./.github/workflows/publish-allure-report.yml
        with:
            report_dir: regression
        secrets: inherit
