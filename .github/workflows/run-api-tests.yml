name: API Tests

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment name from config.ini (blank = config.ini default)"
                required: false
                type: string
            workers:
                description: "pytest-xdist worker count"
                required: false
                type: string
                default: "2"
            marker:
                description: "Optional pytest marker expression, e.g. security or auth and negative"
                required: false
                type: string
            allure_features:
                description: "Optional comma-separated Allure feature names"
                required: false
                type: string
            publish_report:
                description: "Publish an Allure report to gh-pages"
                required: false
                type: boolean
                default: true

permissions:
    contents: write

jobs:
    api-tests:
        uses: ./.github/workflows/test-api.yml
        with:
            environment: ${{ inputs.environment }}
            workers: ${{ inputs.workers }}
            marker: ${{ inputs.marker }}
            allure_features: ${{ inputs.allure_features }}
        secrets: inherit

    publish-report:
        needs: api-tests
        if: always() && inputs.publish_report
        uses: ./.github/workflows/publish-allure-report.yml
        with:
            report_dir: regression-api
        secrets: inherit
